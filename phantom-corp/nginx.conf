server {
    listen 80;
    server_name urdadistribuciones.es www.urdadistribuciones.es;

    client_max_body_size 10M;

    # Seguridad headers (sin revelar demasiado)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /workspace/phantom-corp/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location /favicon.ico {
        alias /workspace/phantom-corp/app/static/img/logo.svg;
    }

    # Proxy a Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30;
        proxy_read_timeout 60;
        proxy_send_timeout 60;
    }
}
