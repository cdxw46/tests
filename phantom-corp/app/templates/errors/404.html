{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}

{% block body %}
<div class="error-page">
    <div class="error-content">
        <h1 class="error-code glitch" data-text="404">404</h1>
        <p class="error-message">ACCESS DENIED — Resource not found</p>
        <p class="text-muted">The requested endpoint does not exist or has been decommissioned.</p>
        <a href="/" class="btn btn-outline">← Return to Base</a>
    </div>
</div>
{% endblock %}
